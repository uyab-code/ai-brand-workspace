version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brandwork-postgres
    environment:
      POSTGRES_DB: brandwork_db
      POSTGRES_USER: brandwork_user
      POSTGRES_PASSWORD: brandwork_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandwork_user -d brandwork_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brandwork-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
